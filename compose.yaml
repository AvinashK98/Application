services:
  frontend:
    image: "${DOCKER_IMG}"
    ports:
      - "${fport}:8080"
    volumes:
      - 'app_data:/app'
    networks:
      - 'mybridge'
    depends_on:
      - 'backend'

  backend:
    image: mysql:latest
    ports:
      - "${bport}:3306"
    volumes:
      - 'db_data:/var/lib/mysql'
    networks:
      - 'mybridge'
    environment:
      - "MYSQL_ROOT_PASSWORD=${dbpass}"
      - "MYSQL_DATABASE=${dbase}"

volumes:
  app_data:
    name: 'app_data'
  db_data:
    name: 'db_data'

networks:
  mybridge:
    name: 'mybridge'
